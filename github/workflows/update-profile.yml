name: Update Profile README

on:
  schedule:
    - cron: '0 0 * * *' # Se ejecuta todos los días a medianoche UTC
  workflow_dispatch: # Permite ejecutarlo manualmente

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      # Aquí puedes usar el paquete "breathing-profile" o simplemente un script de python
      # Por ahora, usaremos el script de actividad de GitHub
      - name: Update Activity Section
        uses: jamesgeorge007/github-activity-readme@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          MAX_LINES: 5
          
      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --quiet || git commit -m "chore: auto-update profile activity"
          git push