services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pleroma
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: pleroma
    volumes:
      - ./postgres:/var/lib/postgresql/data

  pleroma:
    image: ghcr.io/pleroma/pleroma:release
    restart: unless-stopped
    depends_on:
      - db
    environment:
      PLEROMA_DOMAIN: ${DOMAIN}
      PLEROMA_ADMIN_EMAIL: ${ADMIN_EMAIL}
    volumes:
      - ./config:/etc/pleroma
      - ./uploads:/var/lib/pleroma/uploads
    ports:
      - "127.0.0.1:4000:4000"

  web:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - pleroma
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
