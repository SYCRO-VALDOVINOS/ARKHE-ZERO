name: ARKHE-ZERO CI - Fase 1

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install JS deps
        run: npm install
      - name: Install Python deps
        run: pip install cryptography
      - name: Verify JS
        run: node scripts/generate-and-verify-vectors.mjs
      - name: Verify Python valid must PASS
        run: python packages/core/verify.py spec/test-vectors/pcs-v1-valid.json
      - name: Verify Python tampered must FAIL
        run: |
          if python packages/core/verify.py spec/test-vectors/pcs-v1-tampered.json; then echo "ERROR: tampered deberia fallar" && exit 1; else echo "OK: tampered rechazado como se esperaba"; fi
      - name: Export VC Fase 2
        run: node scripts/export-vc.mjs
      - name: Verify VC Fase 2
        run: node scripts/verify-vc.mjs
